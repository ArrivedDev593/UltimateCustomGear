plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}


version = "${minecraft_version}-${mod_version}-NeoForge"
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')

    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenCentral()
    maven {
        url = 'https://maven.creeperhost.net'
        content {
            includeGroup("com.refinedmods.refinedstorage")
        }
    }
    maven {
        url = "https://maven.blamejared.com"
    }
    maven {
        url = "https://maven.theillusivec4.top/"
    }
    maven {
        name = "TerraformersMC"
        url = "https://maven.terraformersmc.com/"
    }
    maven { url "https://maven.shedaniel.me" }
    maven {
        name = "Curse Maven"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        url = uri("https://modmaven.dev/")
        content {
            includeGroup "appeng"
            includeGroup "de.mari_023"
        }
    }
    maven {
        name = "Geckolib Maven"
        url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/"
        content {
            includeGroup "com.geckolib"
        }
    }
}

base {
    archivesName = mod_id
}


java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    accessTransformers.from('src/main/accesstransformer.cfg')


    runs {
        client {
            client()
            gameDirectory = file("run/${minecraft_version}/client")
        }

        server {
            server()
            programArgument '--nogui'
            gameDirectory = file("run/${minecraft_version}/server")
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"

    // Geckolib
    compileOnly "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    localRuntime "com.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // Curios
    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}:api"
    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}+${minecraft_version}"

    // Jade
    localRuntime "curse.maven:jade-324717:8650925"
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            author                 : author,
            displayURL             : displayURL,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_description        : mod_description,
            jei_version            : jei_version,
            geckolib_version       : geckolib_version,
            curios_version         : curios_version
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from('src/main/neoforge.mods.toml') {
        rename '(.*)', 'META-INF/$1'
    }
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '10000' << '-Xmaxwarns' << '20'
    options.getRelease().set(25)
}

// The AT has to be INSIDE the jar for production: accessTransformers.from()
// above only tells moddev where to find it at compile time. Copied straight
// into the jar rather than through generateModMetadata, because that task is a
// ProcessResources whose output feeds createMinecraftArtifacts — routing the AT
// through it makes Gradle see a task reading another's output with no declared
// dependency, and the build fails.
tasks.named('jar') {
    from('src/main/accesstransformer.cfg') {
        into 'META-INF'
    }
}