name: Build

on:
  push:
    branches:
      - "Neo/**"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  pull_request:
    branches:
      - "Neo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      mod_version: ${{ steps.gradle_props.outputs.mod_version }}
      minecraft_version: ${{ steps.gradle_props.outputs.minecraft_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Must match java.toolchain.languageVersion in build.gradle. If it doesn't,
      # foojay downloads the right JDK mid-build: it works, but it re-downloads
      # every run and turns an outage in someone else's service into a failed build.
      - name: Set up JDK 21
        uses: actions/setup-java@v6.1.0
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Read mod properties
        id: gradle_props
        run: |
          set -euo pipefail
          for key in mod_version minecraft_version; do
            value=$(grep -E "^$key=" gradle.properties | head -n1 | cut -d= -f2- | tr -d '[:space:]')
            [ -n "$value" ] || { echo "$key not found in gradle.properties"; exit 1; }
            echo "$key=$value" >> "$GITHUB_OUTPUT"
          done

      - name: Build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ultimatecustomgear-dev
          path: build/libs/*.jar
          retention-days: 14

  # Publishes the jar to CurseForge only when the pushed commit message contains [curseforge], optionally with a
  # release type: [curseforge], [curseforge beta] or [curseforge alpha]. The changelog is the English part of
  # changelogs/changelog-<version>.md or, without it, the body of the commit message. Needs the CURSEFORGE_TOKEN secret
  # and the CURSEFORGE_PROJECT_ID variable of the repository. It is its own job so only it gets write access. The
  # Minecraft version comes from gradle.properties, so this job is the same on every Neo/* branch.
  publish-curseforge:
    needs: build
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[curseforge') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the curseforge-* tag
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: ultimatecustomgear-dev
          path: build/libs

      - name: Publish to CurseForge
        env:
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MOD_VERSION: ${{ needs.build.outputs.mod_version }}
          MC: ${{ needs.build.outputs.minecraft_version }}
        run: |
          set -euo pipefail
          : "${CURSEFORGE_TOKEN:?Add the CURSEFORGE_TOKEN secret to the repository}"
          : "${CURSEFORGE_PROJECT_ID:?Add the CURSEFORGE_PROJECT_ID variable to the repository}"

          RELEASE_TYPE=release
          if [[ "$COMMIT_MESSAGE" =~ \[curseforge\ (alpha|beta|release)\] ]]; then RELEASE_TYPE="${BASH_REMATCH[1]}"; fi

          # The English part of changelogs/changelog-<version>.md (from the first "## " heading up to the "---" or
          # <details> before the Spanish notes), else the commit message without its first line and without the
          # [curseforge] markers, else a plain line
          CHANGELOG=""
          file="changelogs/changelog-$MOD_VERSION.md"
          if [ -f "$file" ]; then
            CHANGELOG=$(awk '/^---[[:space:]]*$/ || /^<details>/{ exit } /^## /{ found=1 } found' "$file")
          fi
          if [ -z "$CHANGELOG" ]; then
            CHANGELOG=$(printf '%s\n' "$COMMIT_MESSAGE" | tail -n +2 | sed -E 's/\[curseforge[^]]*\]//g' | sed '/./,$!d')
          fi
          [ -n "$CHANGELOG" ] || CHANGELOG="UltimateCustomGear-$MC-$MOD_VERSION."

          # A version that is already on CurseForge (marked with a tag once it was uploaded) is not uploaded again
          tag="curseforge-neoforge-$MC-$MOD_VERSION"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null 2>&1; then
            echo "$MC $MOD_VERSION is already on CurseForge (tag $tag), not uploading it again"
            exit 0
          fi

          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          name=$(basename "$jar" .jar)

          metadata=$(jq -nc \
            --arg changelog "$CHANGELOG" \
            --arg type "$RELEASE_TYPE" \
            --arg name "$name" \
            --arg mc "$MC" \
            '{changelog: $changelog, changelogType: "markdown", releaseType: $type, displayName: $name,
              gameVersionNames: [$mc, "NeoForge", "Client", "Server"]}')

          echo "Uploading $jar to CurseForge as a $RELEASE_TYPE for NeoForge $MC"
          curl -sS --fail-with-body -X POST \
            "https://minecraft.curseforge.com/api/projects/$CURSEFORGE_PROJECT_ID/upload-file" \
            -H "X-Api-Token: $CURSEFORGE_TOKEN" \
            -F "metadata=$metadata" -F "file=@$jar"
          echo
          git tag "$tag"
          git push origin "$tag"
