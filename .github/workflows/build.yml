name: Build

on:
  push:
    branches:
      - "Neo/**"
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
  pull_request:
    branches:
      - "Neo/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      # Must match java.toolchain.languageVersion in build.gradle. If it doesn't,
      # foojay downloads the right JDK mid-build: it works, but it re-downloads
      # every run and turns an outage in someone else's service into a failed build.
      - name: Set up JDK 21
        uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ultimatecustomgear-dev
          path: build/libs/*.jar
          retention-days: 14