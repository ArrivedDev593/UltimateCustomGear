name: Check docs

on:
  push:
    branches:
      - "Neo/**"
    paths:
      - "docs/**"
      - "tools/CheckDocsParity.java"
  pull_request:
    paths:
      - "docs/**"
      - "tools/CheckDocsParity.java"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The checker is plain Java with no Minecraft on the classpath, so 21 is
      # enough here even on the branches that build with 25.
      - uses: actions/setup-java@v6.0.1
        with:
          java-version: "21"
          distribution: "temurin"

      # A single source file, uncompiled (JEP 330).
      - name: Check docs parity
        run: java tools/CheckDocsParity.java