# Slot.x and Slot.y are final in vanilla, so a scrolling container cannot move
# its slots — and AbstractContainerScreen reads these fields directly to draw
# and to hit-test, so a subclass with its own coordinates would not be seen.
# Dropping the final is what every scrolling-inventory mod does, Sophisticated
# Storage included.
public-f net.minecraft.world.inventory.Slot x
public-f net.minecraft.world.inventory.Slot y
# imageWidth and imageHeight became final in the 26.x screen rework, and this
# screen has to size itself in init() rather than in its constructor: the
# column count depends on the window width, which the constructor cannot see.
# Same reason the Slot fields above are unfinalled — the vanilla code reads
# these directly to place and hit-test, so computing them anywhere else would
# not be seen.
public-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageWidth
public-f net.minecraft.client.gui.screens.inventory.AbstractContainerScreen imageHeight

# AbstractArrow.baseDamage lost its getter; only the setter survived. This mod
# SCALES the value vanilla just assigned rather than replacing it, so reading it
# back is the whole point — see ArrowUtils.applyArrowDamage.
public net.minecraft.world.entity.projectile.arrow.AbstractArrow baseDamage

# RecipeManager.recipes has no setter, and 26.x dropped the replaceRecipes()
# that 1.21.1 offered. recipe_patch swaps it once per datapack load, in
# TagsUpdatedEvent.ServerDataLoad, just before vanilla runs
# finalizeRecipeLoading — which rebuilds the recipe book, stonecutter and
# property sets from it. See RecipePatchHandler.
public net.minecraft.world.item.crafting.RecipeManager recipes
